version: "3.7"

services:
  maxwelld:
    image: ko10ok/maxwelld:0.3.1
    volumes:
      - .:/project
      - ./docker-compose.yml:/docker-composes/docker-compose.yml
      - ./docker-compose.dev.yml:/docker-composes/docker-compose.dev.yml
      - ./env-tmp${CI_JOB_ID}:/env-tmp  # expose temporal envs; CI_JOB_ID used for runner concurrent runs
    environment:
      - DOCKER_HOST=tcp://dockersock:2375
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      - NON_STOP_CONTAINERS=dockersock,maxwelld,e2e
      - HOST_PROJECT_ROOT_DIRECTORY=${HOST_PROJECT_ROOT_DIRECTORY}
    depends_on:
      dockersock:
        condition: service_healthy

  dockersock:
    image: docker-hub.2gis.ru/ugc/dockersock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: "wget -q -O - http://localhost:2375/v1.40/version || exit 1"
      interval: 5s
      timeout: 10s
      retries: 100
